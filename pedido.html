<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Confirmar pedido</title>

<script>
  window.SUPABASE_CONFIG = {
    url: "https://hxizxxvicgcmmhrkllgd.supabase.co",
    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4aXp4eHZpY2djbW1ocmtsbGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NTEyNTUsImV4cCI6MjEwMDQyNzI1NX0.u73voDUYqWHFdTgzQZefhYFPtcI6Ol_wgltCudgdLdw",
    functionsUrl: "https://hxizxxvicgcmmhrkllgd.supabase.co/functions/v1"
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light;
    --plane:#f4f3ef; --surface:#fffefb; --surface-2:#faf9f5;
    --ink:#1b1a17; --ink-2:#56524a; --ink-muted:#8c877c;
    --border:rgba(27,26,23,0.10);
    --accent:#0f766e; --accent-2:#0b5d56; --accent-ink:#ffffff;
    --good:#15803d; --good-soft:rgba(21,128,61,0.12);
    --danger:#b4271f; --danger-soft:rgba(180,39,31,0.12);
    --shadow-md:0 4px 16px rgba(27,26,23,0.07),0 1px 3px rgba(27,26,23,0.05);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --plane:#100f0e; --surface:#1a1917; --surface-2:#211f1d;
    --ink:#f6f4f0; --ink-2:#b7b2a8; --ink-muted:#847f75;
    --border:rgba(255,255,255,0.10);
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-ink:#04211d;
    --good:#4ade80; --good-soft:rgba(74,222,128,0.15);
    --danger:#f87171; --danger-soft:rgba(248,113,113,0.15);
    --shadow-md:0 4px 16px rgba(0,0,0,0.5),0 1px 3px rgba(0,0,0,0.4);
  } }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:30px 26px;}
  h1{font-size:19px;font-weight:700;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-muted);margin-bottom:22px;}
  .field{margin-bottom:14px;} .field label{display:block;font-size:12.5px;font-weight:560;color:var(--ink-2);margin-bottom:6px;}
  input, textarea{width:100%;font-size:14px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;}
  textarea{resize:vertical;min-height:70px;}
  .btn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--accent);color:var(--accent-ink);font-size:14.5px;font-weight:650;cursor:pointer;margin-top:8px;}
  .btn:hover{background:var(--accent-2);} .btn:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;margin-top:14px;padding:10px 12px;border-radius:9px;line-height:1.5;}
  .msg.err{background:var(--danger-soft);color:var(--danger);} .msg.ok{background:var(--good-soft);color:var(--good);}
  .state{text-align:center;padding:20px 0;}
  .state svg{margin-bottom:10px;}
  .hidden{display:none !important;}
  .cod-note{font-size:12px;color:var(--ink-muted);text-align:center;margin-top:16px;line-height:1.5;}
</style>
</head>
<body>

<div class="card">
  <div id="loading" class="state"><div style="font-size:13px;color:var(--ink-muted)">Cargando…</div></div>

  <div id="not-found" class="state hidden">
    <div style="font-size:14px;color:var(--ink-2)">No encontramos esta tienda. Verifica el link.</div>
  </div>

  <div id="form-wrap" class="hidden">
    <h1 id="store-title">Confirma tu pedido</h1>
    <div class="sub">Paga cuando lo recibas — sin adelantar nada.</div>
    <form id="order-form">
      <div class="field"><label for="f-name">Nombre completo</label><input type="text" id="f-name" required /></div>
      <div class="field"><label for="f-phone">WhatsApp / Teléfono</label><input type="tel" id="f-phone" placeholder="09XXXXXXXX" required /></div>
      <div class="field"><label for="f-address">Dirección de entrega</label><textarea id="f-address" required></textarea></div>
      <div class="field"><label for="f-product">Producto / talla / color</label><input type="text" id="f-product" placeholder="Ej: Tobillera EVO, talla M" /></div>
      <div class="field"><label for="f-notes">Notas (opcional)</label><input type="text" id="f-notes" /></div>
      <button type="submit" class="btn" id="submit-btn">Confirmar pedido</button>
    </form>
    <div id="form-msg"></div>
    <div class="cod-note">Al enviar, te contactaremos por WhatsApp para confirmar tu pedido antes de despacharlo.</div>
  </div>

  <div id="success" class="state hidden">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
    <div style="font-size:15px;font-weight:650;margin-bottom:6px">¡Pedido recibido!</div>
    <div style="font-size:13px;color:var(--ink-muted);line-height:1.5">Te vamos a contactar por WhatsApp en breve para confirmar tu pedido.</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var CFG = window.SUPABASE_CONFIG || {};
  var configured = CFG.url && CFG.anonKey && CFG.url.indexOf("PEGA_AQUI") === -1;
  var el = function (id) { return document.getElementById(id); };
  function show(n) { n.classList.remove("hidden"); } function hide(n) { n.classList.add("hidden"); }

  var params = new URLSearchParams(location.search);
  var slug = params.get("t");

  function fail(msg) {
    hide(el("loading")); show(el("not-found"));
    if (msg) el("not-found").querySelector("div").textContent = msg;
  }

  if (!configured || !slug) { fail(!slug ? "Falta el identificador de la tienda en el link (?t=...)." : "Falta configurar Supabase en este archivo."); return; }

  var sb = window.supabase.createClient(CFG.url, CFG.anonKey);
  var store = null;

  sb.from("stores_public").select("*").eq("slug", slug).maybeSingle().then(function (res) {
    if (res.error || !res.data) { fail(); return; }
    store = res.data;
    el("store-title").textContent = "Confirma tu pedido en " + store.store_name;
    hide(el("loading")); show(el("form-wrap"));
  });

  el("order-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = el("submit-btn"), msgEl = el("form-msg");
    msgEl.innerHTML = "";
    var payload = {
      store_slug: slug,
      customer_name: el("f-name").value.trim(),
      customer_phone: el("f-phone").value.trim(),
      customer_address: el("f-address").value.trim(),
      product: el("f-product").value.trim(),
      notes: el("f-notes").value.trim(),
    };
    btn.disabled = true; btn.textContent = "Enviando…";
    fetch(CFG.functionsUrl + "/submit-order", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + CFG.anonKey },
      body: JSON.stringify(payload),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        btn.disabled = false; btn.textContent = "Confirmar pedido";
        if (!res.ok) { msgEl.innerHTML = '<div class="msg err">No se pudo enviar tu pedido. Intenta de nuevo.</div>'; return; }
        hide(el("form-wrap")); show(el("success"));
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = "Confirmar pedido";
        msgEl.innerHTML = '<div class="msg err">Error de conexión. Intenta de nuevo.</div>';
      });
  });
})();
</script>
</body>
</html>
